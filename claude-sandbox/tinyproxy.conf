# tinyproxy as the sandbox's only way out — runbooks/claude-sandbox.md. It
# forwards HTTPS to the hosts in allowlist and refuses everything else.

Port 8888
Timeout 600
MaxClients 64
DisableViaHeader Yes

# HTTPS through a proxy is a CONNECT. Port 443 only: no SSH, no mail.
ConnectPort 443

# Only the hosts allowlist names get through. fnmatch, so *.example.com works.
Filter "/etc/tinyproxy/allowlist"
FilterType fnmatch
FilterDefaultDeny Yes

# Info names every host the agent asked for. The launcher reads the refused
# ones out of the log when the session ends.
LogLevel Info
