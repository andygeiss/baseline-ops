name: claude-sandbox

# The sandbox image on the Mac (runbooks/claude-sandbox.md) is built from minor
# tags and Debian's packages, so what it holds moves under a Containerfile
# nobody edited. This gate builds it the way make claude-sandbox does, and
# checks what the sandbox counts on and nothing else would catch: the pinned
# Claude Code, egress and statusline run, the agent is uid 1000, go test -race
# works, egress lets a public host through and refuses a private address, the
# status line command draws a line, and the managed settings start on Opus 5.5.
#
# The launcher's own flags — the mounts, the internal network, the dropped
# capabilities — need the Mac's podman machine. The runbook's "Check that it
# holds" covers those, by hand.
on:
  push:
    branches: [main]
    paths: ["claude-sandbox/**", ".github/workflows/claude-sandbox.yml"]
  pull_request:
    paths: ["claude-sandbox/**", ".github/workflows/claude-sandbox.yml"]
  schedule:
    - cron: "0 6 * * 2"   # weekly: golang:1.27-trixie, node:24-trixie-slim and Debian's packages move under their tags
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: claude-sandbox-check
  PROXY: http://proxy:8888

jobs:
  containerfile:
    # arm64, like the Mac. npm picks Claude Code's binary per platform, and
    # Debian builds its packages per architecture, so an amd64 runner would
    # check binaries the Mac never runs.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --pull, as make claude-sandbox builds: the base images as they are
      # today, not as the runner cached them.
      - name: Build
        run: docker build --pull -t "$IMAGE" -f claude-sandbox/Containerfile claude-sandbox

      # Claude Code's npm package is a wrapper, and the Containerfile copies the
      # binary out of it by path. When Anthropic changes how the package ships
      # it, the next version bump fails here: at the build, or with a binary
      # that does not run.
      - name: Claude Code runs, at the pinned version
        run: |
          set -eu
          want=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' claude-sandbox/Containerfile)
          got=$(docker run --rm "$IMAGE" claude --version)
          echo "$got"
          case "$got" in
            "$want "*) ;;
            *) echo "want Claude Code $want"; exit 1 ;;
          esac

      # go install stamps the version it built, and egress -version prints it.
      # A build of anything else prints something else, or "unknown".
      - name: egress runs, at the pinned version
        run: |
          set -eu
          want=$(sed -n 's/^ARG EGRESS_VERSION=//p' claude-sandbox/Containerfile)
          got=$(docker run --rm "$IMAGE" egress -version)
          echo "$got"
          [ "$got" = "$want" ] || { echo "want egress $want"; exit 1; }

      # The same check for statusline: go install stamps the version, and
      # statusline version prints it.
      - name: statusline runs, at the pinned version
        run: |
          set -eu
          want=$(sed -n 's/^ARG STATUSLINE_VERSION=//p' claude-sandbox/Containerfile)
          got=$(docker run --rm "$IMAGE" statusline version)
          echo "$got"
          [ "$got" = "$want" ] || { echo "want statusline $want"; exit 1; }

      # Claude Code runs the command that the image's managed settings name,
      # through a shell, with its status JSON on stdin, and shows the first line.
      # A setting that names a missing binary, or a binary that cannot read the
      # JSON, leaves no line at all.
      - name: The status line command draws a line
        run: |
          set -eu
          json='{"model":{"display_name":"Opus"},"workspace":{"current_dir":"/tmp"}}'
          line=$(printf '%s' "$json" | docker run --rm -i "$IMAGE" \
            sh -c 'cmd=$(jq -r .statusLine.command /etc/claude-code/managed-settings.json) && sh -c "$cmd"')
          echo "$line"
          case "$line" in
            *Opus*) ;;
            *) echo "the line names no model"; exit 1 ;;
          esac

      # Every session starts on Opus 5.5, in old volumes and new.
      - name: The managed settings start on Opus 5.5
        run: |
          set -eu
          got=$(docker run --rm "$IMAGE" jq -r .model /etc/claude-code/managed-settings.json)
          [ "$got" = claude-opus-5-5 ] || { echo "want model claude-opus-5-5, got $got"; exit 1; }

      # The launcher maps your Mac user to uid 1000 (--userns keep-id), which is
      # what makes the agent's files yours. Under any other uid they belong to a
      # stranger.
      - name: The agent is uid 1000
        run: |
          set -eu
          got=$(docker run --rm "$IMAGE" sh -c 'echo "$(id -un):$(id -u)"')
          [ "$got" = agent:1000 ] || { echo "runs as $got, want agent:1000"; exit 1; }

      # make check runs go test -race, which needs cgo and gcc. The Containerfile
      # counts on the base image to ship both.
      - name: go test -race works
        run: |
          docker run --rm "$IMAGE" sh -euc '
            cd "$(mktemp -d)"
            go mod init example.com/race 2> /dev/null
            printf "package race\n\nimport \"testing\"\n\nfunc TestRace(t *testing.T) {}\n" > race_test.go
            go test -race ./...'

      # The proxy is the agent's only way out. It runs here as the launcher runs
      # it: as nobody, read-only, with no capabilities, and listening on every
      # address, so the agent's network reaches it.
      - name: Start the proxy as the launcher does
        run: |
          set -eux
          docker network create sandbox
          docker run -d --name proxy --network sandbox \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true --user nobody \
            "$IMAGE" egress -listen :8888

      # Any answer from Anthropic's side counts — the API's root says 404. The
      # retries wait for the proxy to listen. egress looks the name up through
      # the network's resolver, which sits at a private address, so this also
      # shows that its check leaves DNS alone.
      - name: A public host gets through
        run: |
          set -eu
          code=$(docker run --rm --network sandbox --env https_proxy="$PROXY" "$IMAGE" \
            curl -sS --retry 5 --retry-connrefused --retry-delay 1 -o /dev/null -w '%{http_code}' https://api.anthropic.com/)
          echo "api.anthropic.com answered $code"

      # Refused has to mean the proxy's own 403 on the CONNECT: a network error
      # fails the same curl, and would pass a check that only wanted a failure.
      # 10.0.0.1 stands in for your LAN. The launcher names what the proxy
      # refused at the end of a session by reading this log line.
      - name: A private address gets the proxy's 403, logged the way the launcher reads it
        run: |
          set -eu
          if out=$(docker run --rm --network sandbox --env https_proxy="$PROXY" "$IMAGE" \
            curl -sS -o /dev/null --max-time 10 https://10.0.0.1/ 2>&1); then
            echo "10.0.0.1 got through the proxy"; exit 1
          fi
          echo "$out"
          case "$out" in
            *"CONNECT tunnel failed, response 403"*) ;;
            *) echo "failed, but not with the proxy's 403"; exit 1 ;;
          esac
          docker logs proxy 2>&1 | grep '^egress: refuse 10\.0\.0\.1:443 '

      # Port 443 only: a public host stays shut on any other port, so the agent
      # gets HTTPS and not SSH or mail.
      - name: A public host on another port gets the proxy's 403
        run: |
          set -eu
          if out=$(docker run --rm --network sandbox --env https_proxy="$PROXY" "$IMAGE" \
            curl -sS -o /dev/null --max-time 10 https://api.anthropic.com:22/ 2>&1); then
            echo "port 22 got through the proxy"; exit 1
          fi
          echo "$out"
          case "$out" in
            *"CONNECT tunnel failed, response 403"*) ;;
            *) echo "failed, but not with the proxy's 403"; exit 1 ;;
          esac

      - name: Proxy logs
        if: always()
        run: docker logs proxy || true
