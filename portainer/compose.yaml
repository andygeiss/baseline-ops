# The optional look at what is running — servers/vserver.md, "Portainer". It
# lives at /opt/portainer/ on the server; runbooks/portainer.md puts it there.
#
# It mounts the Docker socket, which is root on this host. Its login is the
# only thing between the internet and that socket, so the password is a long
# one, and nothing here is copied to any other server without that thought.
#
# No public port: the proxy reaches it by name on the web network and serves
# it under its own domain with a real certificate. The one published port is
# on loopback, for the ssh -L path that works before DNS does.

name: portainer

services:
  portainer:
    image: portainer/portainer-ce:2.45.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"   # ssh -L 9443:127.0.0.1:9443 andygeiss@vserver, then https://localhost:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data    # the admin user and every setting
    networks:
      web:
        aliases: [portainer]    # what the site file names: reverse_proxy portainer:9000
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  web:
    external: true              # the proxy's network — runbooks/caddy.md

volumes:
  portainer_data:
    external: true              # docker volume create portainer_data, once; it outlives this file
