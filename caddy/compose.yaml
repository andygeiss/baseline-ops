# The one proxy on the server. It lives at /opt/caddy/ and is the only stack
# that publishes a port: every application sits behind it on the `web`
# network, with no ports: block of its own. runbooks/caddy.md puts it there.
#
# This file is not a template. Applications copy templates/; this directory is
# the server's own stack, deployed from this repository.

name: caddy

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:                      # the only public listener on the box
      - "80:80"                 # ACME challenge + the redirect to HTTPS
      - "443:443"
      - "443:443/udp"           # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro   # one file per application; new-app.md writes it
      - caddy_data:/data        # certificates + the ACME account: MUST outlive the container
      - caddy_config:/config
    networks: [web]             # where the applications are — see vserver.md
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # the one capability needed to bind 80 and 443
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  web:
    external: true              # created once, by hand: docker network create web

volumes:
  caddy_config:
  caddy_data:
